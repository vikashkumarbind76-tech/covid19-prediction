<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - COVID-19 AI Diagnostics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="glass-bg-blobs">
        <div class="blob blob-purple"></div>
        <div class="blob blob-cyan"></div>
    </div>

    <div class="auth-container">
        <div class="card glass-card auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-user-plus auth-icon"></i>
                <h2>Create Account</h2>
                <p>Register to save screening records and download clinical reports</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('register') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Select Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-at"></i>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Choose a strong password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-signature"></i>
                        <input type="text" id="name" name="name" placeholder="e.g., John Doe" required autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-cake-candles"></i>
                            <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g., 28" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-venus-mars"></i>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    <i class="fa-solid fa-user-check"></i> Register Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account?</p>
                <a href="{{ url_for('login') }}" class="btn-back-home" style="margin-top: 0.5rem; display: inline-block; font-weight: 600;">
                    <i class="fa-solid fa-right-to-bracket"></i> Log In Here
                </a>
            </div>
        </div>
    </div>
</body>
</html>
