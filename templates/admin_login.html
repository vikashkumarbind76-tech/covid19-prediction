<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - COVID-19 AI Diagnostics</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="glass-bg-blobs">
        <div class="blob blob-purple"></div>
        <div class="blob blob-cyan"></div>
    </div>

    <div class="auth-container">
        <div class="card glass-card auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-user-shield auth-icon"></i>
                <h2>Security Authentication</h2>
                <p>Access the administrative analytics panel</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('admin_login') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Administrator Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Security Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Authenticate
                </button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('index') }}" class="btn-back-home">
                    <i class="fa-solid fa-house"></i> Return to Screening Portal
                </a>
            </div>
        </div>
    </div>
</body>
</html>
